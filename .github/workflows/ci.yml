name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Ensure script utility is installed on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v script >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bsdextrautils util-linux
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and PTY tests
        env:
          CI: "true"
        run: go test -v ./...

      - name: Cross-build for Windows
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -v -o zsplash.exe .
