version: 2

project_name: zsplash

before:
  hooks:
    - go mod tidy

builds:
  - id: zsplash
    main: .
    binary: zsplash
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: zsplash
    repository:
      owner: acorrow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/acorrow/zsplash"
    description: "Lightweight CLI utility for colorful, expressive Zsh & terminal text (includes zsp alias)"
    license: "MIT"
    extra_install: |
      bin.install_symlink "zsplash" => "zsp"
    test: |
      system "#{bin}/zsplash", "--version"
      system "#{bin}/zsp", "--version"

checksum:
  name_template: "checksums.txt"
